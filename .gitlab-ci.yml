# CI for Vivari. Three tiers, cheapest first:
#
#   gate    — offline, Wasm-free spikes (the toolchain subsystem guard + the
#             llhttp Wasm HTTP-parser guard). Runs on every push/MR; seconds;
#             catches silent regressions such as esbuild-wasm version drift, a
#             broken native->wasm alias table, or a broken llhttp Wasm bridge.
#   verify  — the hermetic offline suite (scripts/verify-node.mjs). Needs the Wasm
#             VFS/codec/crypto built for Node; runs on MRs + the default branch.
#   spikes  — the network tier: boots real templates and installs from the live npm
#             registry in-VM. Slow + registry-dependent, so it's manual/scheduled.
#
# Adjust `image`/`tags` to match your GitLab runners if needed.

stages: [gate, verify, spikes]

default:
  image: node:22-bookworm

variables:
  # Keep cargo/rustup state inside the project dir so it can be cached.
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  RUSTUP_HOME: "$CI_PROJECT_DIR/.rustup"

# --- fast gate: offline, no Wasm, every push ---------------------------------
toolchain-gate:
  stage: gate
  script:
    - node scripts/run-spikes.mjs --offline
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

# Shared setup for jobs that need the Rust->Wasm build (verify + net spikes).
.needs-wasm:
  cache:
    key: rust-wasm
    paths: [.cargo/, .rustup/, target/]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl build-essential pkg-config libssl-dev
    - curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
    - export PATH="$CARGO_HOME/bin:$PATH"
    - curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - npm run build:vfs:node && npm run build:codec:node && npm run build:crypto:node

# --- offline hermetic suite ---------------------------------------------------
verify:
  stage: verify
  extends: .needs-wasm
  script:
    - export PATH="$CARGO_HOME/bin:$PATH"
    - npm run verify
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- network tier: real template installs from the live registry --------------
# Manual (or scheduled): slow and depends on registry.npmjs.org being reachable.
spikes-net:
  stage: spikes
  extends: .needs-wasm
  timeout: 2h
  script:
    - export PATH="$CARGO_HOME/bin:$PATH"
    - npm run spikes:net
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
