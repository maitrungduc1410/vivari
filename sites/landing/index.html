<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- %VV_*% are substituted at build time from `seo` in src/site.ts, which is
         the single source of truth for the head. Edit them there, not here. -->
    <title>%VV_TITLE%</title>
    <meta name="description" content="%VV_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%VV_TITLE%" />
    <meta property="og:description" content="%VV_OG_DESCRIPTION%" />
    <meta property="og:image" content="%VV_IMAGE%" />
    <meta property="og:url" content="%VV_URL%" />
    <meta property="og:image:width" content="%VV_IMAGE_WIDTH%" />
    <meta property="og:image:height" content="%VV_IMAGE_HEIGHT%" />
    <meta property="og:image:alt" content="%VV_TITLE%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%VV_TITLE%" />
    <meta name="twitter:description" content="%VV_TWITTER_DESCRIPTION%" />
    <meta name="twitter:image" content="%VV_IMAGE%" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
