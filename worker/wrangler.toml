# Cloudflare Worker for mode C — wildcard per-port preview origins.
#
# Deploy with:  npm run deploy:worker   (runs `wrangler deploy` in this dir)
# Assets are assembled from the studio build into ./public by
# scripts/assemble-worker.mjs (run `npm run build:worker` first).
#
# See sites/docs/docs/deployment.md → "Mode C" for the full setup (wildcard DNS +
# route + the VITE_PREVIEW_WILDCARD_DOMAIN env on the IDE build).

name = "vivari-preview"
main = "src/index.js"
# Pins the Workers runtime behavior to this date (any date <= today). Bump it (and
# re-test) to opt into newer runtime defaults; it is NOT tied to the current year.
compatibility_date = "2026-07-01"

# Static SW-runtime files (sw.js, __vv-bridge.html, __vv-preview-boot.html,
# vv-devtools/*). run_worker_first lets index.js gate on the hostname and stamp
# isolation headers on every response instead of Cloudflare serving assets raw.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Wildcard route for the per-port preview hosts. Requires a PROXIED wildcard DNS
# record `*.<domain>` on the zone. vivari.run is dedicated to Vivari, so preview
# hosts carry no marker label and the route is the plain `*.<domain>/*`. That is
# broader than the host set we serve, which is why src/index.js gates on
# PREVIEW_HOST and passes anything that is not a `<token>--<port>` host straight
# through — adding e.g. a docs subdomain later stays safe.
#
# On a domain that ALSO serves other apps, set BootOptions.previewWildcardTag
# (e.g. "vv") and narrow this to `*-vv.<domain>/*`. The tag must be a SUFFIX:
# Cloudflare only allows the wildcard at the START of the hostname, so a prefix
# `vv-*.<domain>/*` is rejected as an infix wildcard.
#
# Change `vivari.run` to your own zone (keep it in sync with the IDE build's
# VITE_PREVIEW_WILDCARD_DOMAIN). Binding this route on deploy needs an API token
# with "Workers Routes: Edit" on the zone; otherwise comment this out and add the
# route in the dashboard (Workers → Domains & Routes).
[[routes]]
pattern = "*.vivari.run/*"
zone_name = "vivari.run"