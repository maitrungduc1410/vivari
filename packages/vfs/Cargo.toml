[package]
name = "open-webcontainer-vfs"
version = "0.1.0"
edition = "2021"
description = "OpenContainer VFS: in-RAM Virtual File System compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
# Pure-Rust zlib (miniz_oxide) so it compiles cleanly to wasm32 with no C toolchain.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = "s"
lto = true
