[package]
name = "open-webcontainer-kernel"
version = "0.1.0"
edition = "2021"
description = "OpenContainer kernel: in-RAM Virtual File System compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
