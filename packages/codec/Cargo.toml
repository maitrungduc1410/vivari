[package]
name = "vivari-codec"
version = "0.1.0"
edition = "2021"
description = "Vivari compression codec (zlib/deflate/gzip + brotli) compiled to WebAssembly, running in-process beneath Node's real lib/zlib.js"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# miniz_oxide backend = pure Rust, compiles cleanly to wasm32-unknown-unknown.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
brotli = { version = "8.0.4", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"
lto = true