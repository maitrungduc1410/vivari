[package]
name = "vivari-crypto"
version = "0.1.0"
edition = "2021"
description = "Vivari crypto core (hashes/HMAC/PBKDF2/AES) compiled to WebAssembly, running in-process beneath Node's real lib/crypto.js"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# Pure-Rust RustCrypto primitives — all compile cleanly to wasm32-unknown-unknown.
# Symmetric/KDF primitives take explicit salts/ivs from JS; the asymmetric S3
# additions (keygen) need entropy, so getrandom's `js` backend routes to the
# Worker's WebCrypto (browser) / node:crypto (nodejs target) at runtime.
md-5 = "0.10"
# `oid` on sha1/sha2 provides the AssociatedOid used to build RSA PKCS#1v15
# DigestInfo prefixes (RS256/384/512).
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
hmac = "0.12"
# --- P2D: the rest of Bun.CryptoHasher's algorithm family --------------------
# All four are the digest-0.10 generation, matching sha1/sha2/md-5 above, so
# there is exactly one `digest::Digest` trait in the graph. `blake2` is the odd
# one out at HMAC time — see the note on hmac_digest() in src/lib.rs.
blake2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
ripemd = { version = "0.1", default-features = false }
md4 = { version = "0.10", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes = "0.8"
cbc = { version = "0.1", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
cipher = { version = "0.4", default-features = false, features = ["block-padding", "alloc"] }
# --- S3: scrypt + asymmetric (ECDSA P-256/P-384, Ed25519) --------------------
scrypt = { version = "0.11", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "arithmetic"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "arithmetic"] }
# p256/p384's SecretKey is elliptic_curve::SecretKey<C>; its `sec1` feature unlocks
# from_sec1_der (S3 phase 3: SEC1 'EC PRIVATE KEY'). Features are additive, so
# enabling it here turns it on for both curves.
elliptic-curve = { version = "0.13", default-features = false, features = ["sec1", "pkcs8", "alloc"] }
ed25519-dalek = { version = "2", default-features = false, features = ["pkcs8", "rand_core", "alloc"] }
# RSA (S3 phase 2): RS256/384/512 + PSS sign/verify, OAEP/PKCS1v15 encrypt/decrypt,
# keygen. Pure Rust (num-bigint-dig); pkcs1/pkcs8/spki key handling built in.
rsa = { version = "0.9", default-features = false }
ecdsa = { version = "0.16", default-features = false, features = ["der", "hazmat", "pkcs8", "alloc"] }
pkcs8 = { version = "0.10", default-features = false, features = ["alloc"] }
spki = { version = "0.7", default-features = false, features = ["alloc"] }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
# --- P2D: Bun.password (argon2id / bcrypt) -----------------------------------
# Real argon2 and bcrypt, emitting/parsing the standard PHC and modular-crypt
# strings, so a hash written in the sandbox verifies under real Bun (and vice
# versa). Neither is in RustCrypto's digest family; both are the reference pure-
# Rust implementations, and both compile to wasm32-unknown-unknown.
#
# `password-hash` (via argon2) brings the PHC serializer/parser; salts are drawn
# from the OsRng already used by keygen above rather than from each crate's own
# entropy path, so there is one entropy source in this crate.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
bcrypt = { version = "0.19", default-features = false, features = ["std"] }
# bcrypt pulls getrandom 0.4, whose wasm32-unknown-unknown backend is opt-in: it
# hard `compile_error!`s unless `wasm_js` is enabled, even on the code paths we
# never call (we pass our own salt). Declaring it here turns that feature on for
# the whole graph. This is the 0.4-line twin of the `getrandom 0.2 + js` above —
# both resolve to crypto.getRandomValues (WebCrypto in the Worker, node:crypto
# under the nodejs target); the two majors cannot be unified.
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
# Trait bounds for the generic RSA sign/verify/OAEP bodies (AssociatedOid for the
# PKCS#1v15 DigestInfo prefix; DynDigest for OAEP's MGF).
digest = { version = "0.10", default-features = false, features = ["alloc", "oid"] }
const-oid = { version = "0.9", default-features = false }
# X.509 (S3 phase 3): parse certificates for `new X509Certificate(...)` (driven by
# jose's importX509). Reuses the der/spki/const-oid 0.7/0.9 stack pulled in above.
x509-cert = { version = "0.2", default-features = false }
# Structured cert fields cross to JS as JSON (safe escaping of subject/SAN text).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true